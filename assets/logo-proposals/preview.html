<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DroneAtlas logo proposals</title>
<style>
  @font-face{font-family:"Space Grotesk";src:url("../fonts/SpaceGrotesk-latin.woff2") format("woff2");font-weight:400 700;font-display:swap}
  html,body{margin:0;background:#000;color:#EDEDED;font-family:"Space Grotesk",Helvetica,Arial,sans-serif}
  main{padding:48px 40px 56px}
  h1{font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;color:#A8A8A8;margin:0 0 28px}
  .row{display:grid;grid-template-columns:220px 1fr 120px;gap:28px;align-items:center;padding:28px 0;border-top:1px solid rgba(237,237,237,.12)}
  .label{font-size:13px;color:#A8A8A8}
  .label b{display:block;color:#EDEDED;font-size:16px;margin-bottom:4px}
  .large{height:84px;width:auto}
  .header{height:28px;width:auto}
  .fav{width:32px;height:32px}
  .pair{display:flex;align-items:center;gap:28px}
</style>
</head>
<body>
<main>
  <h1>Logo proposals · not in use</h1>
  <div class="row">
    <div class="label"><b>A · Contour</b>Refined peak. Closest to the current mark.</div>
    <div class="pair">
      <img class="large" src="concept-a-contour.svg" alt="">
      <img class="header" src="concept-a-contour.svg" alt="">
    </div>
    <img class="fav" src="concept-a-favicon.svg" alt="">
  </div>
  <div class="row">
    <div class="label"><b>B · Grid</b>Map tile and a single contour.</div>
    <div class="pair">
      <img class="large" src="concept-b-grid.svg" alt="">
      <img class="header" src="concept-b-grid.svg" alt="">
    </div>
    <img class="fav" src="concept-b-favicon.svg" alt="">
  </div>
  <div class="row">
    <div class="label"><b>C · Drone</b>Four rotors over a small body.</div>
    <div class="pair">
      <img class="large" src="concept-c-drone.svg" alt="">
      <img class="header" src="concept-c-drone.svg" alt="">
    </div>
    <img class="fav" src="concept-c-favicon.svg" alt="">
  </div>
</main>
</body>
</html>
